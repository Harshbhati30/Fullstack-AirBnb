spring.config.import=optional:file:.env[.properties]

# ===========================
# SERVER
# ===========================
server.port=8080
server.servlet.context-path=/api

# ===========================
# DATABASE
# ===========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/airbnb_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / HIBERNATE
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================
# JWT  (secret must be a Base64 string of 64+ random bytes)
# ===========================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# ===========================
# OAUTH2
# ===========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# ===========================
# FILE UPLOAD
# ===========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=uploads

# ===========================
# RAZORPAY
# ===========================
razorpay.key.id=${RAZORPAY_KEY_ID:YOUR_RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:YOUR_RAZORPAY_KEY_SECRET}

# ===========================
# CORS / FRONTEND  (Vite dev server = 5173)
# ===========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ===========================
# APP RULES
# ===========================
app.booking.pending-expiry-minutes=30
app.admin.email=${ADMIN_EMAIL:admin@airbnb.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}